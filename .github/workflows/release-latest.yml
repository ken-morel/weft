name: Release

on:
  push:
    branches: [nightly]
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    name: Build & Publish Binaries
    steps:
      - name: Checkout weft
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: master

      - name: Build Weft (ReleaseSafe)
        run: |
          for arch in x86_64 aarch64; do
            zig build -Doptimize=ReleaseSafe -Dtarget="${arch}-linux" -p "zig-out-${arch}"
            tar -czf "weft-linux-${arch}.tar.gz" -C "zig-out-${arch}/bin" weft
          done
          sha256sum weft-linux-x86_64.tar.gz weft-linux-aarch64.tar.gz > checksums.txt

      - name: Move nightly tag
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          git tag -f nightly "${GITHUB_SHA}"
          git push -f origin refs/tags/nightly

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'nightly' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Weft Nightly' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: |
            weft-linux-x86_64.tar.gz
            weft-linux-aarch64.tar.gz
            checksums.txt

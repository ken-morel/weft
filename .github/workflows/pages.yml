name: Pages

on:
  push:
    branches: [dev]
    paths: ['site/**', 'weft/**', 'action.yml', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./
        with:
          version: nightly
          daemon: kvm-small
          cache-nix: true
          cache-keep: true

      - name: Check Weft workspace
        run: weft check

      - name: Test and build site with Weft
        run: weft do site-fetch - site-test - pages:site-build

      - name: Locate site-build artifact
        id: artifact
        run: echo "path=$(weft artifact path site-build)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.artifact.outputs.path }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

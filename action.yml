name: "Setup Weft"
description: "Downloads and installs the pre-built Weft binary"
inputs:
  version:
    description: "Release tag to install (e.g. nightly or a specific release tag like v0.1.0)"
    required: false
    default: "nightly"
runs:
  using: "composite"
  steps:
    - name: Download and install Weft
      shell: bash
      run: |
        echo "Installing Weft (${{ inputs.version }})..."
        curl -fsSL "https://github.com/ken-morel/weft/releases/download/${{ inputs.version }}/weft-linux-x86_64.tar.gz" | sudo tar -xz -C /usr/local/bin
        sudo chmod +x /usr/local/bin/weft
        weft version
        echo "Weft installed successfully to /usr/local/bin/weft"
